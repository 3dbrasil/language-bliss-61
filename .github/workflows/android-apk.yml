name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Confirm Node 22 is active
        run: |
          node --version
          npm --version
          test "$(node -p "process.versions.node.split('.')[0]")" -ge 22

      - name: Install dependencies
        run: npm install

      - name: Create stub dist for Capacitor
        run: |
          mkdir -p dist
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>Dialogoo</title>
          <meta http-equiv="refresh" content="0;url=https://language-bliss-61.lovable.app">
          </head><body>Loading...</body></html>
          EOF

      - name: Add Android platform
        run: |
          node --version
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android app icon
        run: |
          mkdir -p assets
          curl -fL "https://language-bliss-61.lovable.app/__l5e/assets-v1/1dac785e-967a-4eb3-883b-af4a59f57601/dialogoo-logo.png" -o assets/logo.png
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#0A0F1A' --iconBackgroundColorDark '#0A0F1A' --splashBackgroundColor '#0A0F1A' --splashBackgroundColorDark '#0A0F1A'

      - name: Ensure Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.RECORD_AUDIO" $MANIFEST || \
            sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application|' $MANIFEST
          grep -q "android.permission.MODIFY_AUDIO_SETTINGS" $MANIFEST || \
            sed -i 's|<application|<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application|' $MANIFEST
          grep -q "android.permission.INTERNET" $MANIFEST || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' $MANIFEST

      - name: Grant gradlew permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
